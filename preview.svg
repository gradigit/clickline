<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 148" width="760" height="148">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace; font-size: 13.5px; }
      .bold { font-weight: bold; }
      .italic { font-style: italic; }
      .link { text-decoration: underline; text-underline-offset: 3px; }
    </style>
  </defs>

  <!-- Window chrome -->
  <rect width="760" height="148" fill="#181825" rx="10"/>

  <!-- Title bar -->
  <rect width="760" height="34" fill="#1e1e2e" rx="10"/>
  <rect y="20" width="760" height="14" fill="#1e1e2e"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="17" r="5.5" fill="#f38ba8"/>
  <circle cx="38" cy="17" r="5.5" fill="#f9e2af"/>
  <circle cx="56" cy="17" r="5.5" fill="#a6e3a1"/>

  <!-- Window title -->
  <text x="380" y="22" text-anchor="middle" fill="#585b70" font-size="12">Claude Code — clickline</text>

  <!-- Content background -->
  <rect y="34" width="760" height="114" fill="#1e1e2e"/>

  <!-- Prompt line (decorative) -->
  <text x="18" y="62" fill="#585b70">❯</text>

  <!-- ── LINE 1 ── -->
  <text x="34" y="90">
    <!-- path: sapphire, underlined -->
    <tspan class="link" fill="#74c7ec">my-app/src</tspan>
    <tspan fill="#585b70"> · </tspan>
    <!-- branch: green, underlined -->
    <tspan class="link" fill="#a6e3a1">feat/dark-mode</tspan>
    <tspan fill="#585b70"> │ </tspan>
    <!-- model: lavender bold -->
    <tspan class="bold" fill="#b4befe">Claude Sonnet 4.6</tspan>
    <tspan fill="#585b70"> │ </tspan>
    <!-- service links: sky, underlined -->
    <tspan class="link" fill="#89dceb">backend</tspan>
    <tspan fill="#585b70"> · </tspan>
    <tspan class="link" fill="#89dceb">frontend</tspan>
    <tspan fill="#585b70"> · </tspan>
    <tspan class="link" fill="#89dceb">db</tspan>
  </text>

  <!-- ── LINE 2 ── -->
  <text x="34" y="115">
    <!-- context %: gold bold -->
    <tspan class="bold" fill="#f9e2af">35%</tspan>
    <tspan fill="#45475a">/200K</tspan>
    <tspan fill="#585b70"> │ </tspan>
    <!-- 5h quota: green bold, underlined -->
    <tspan class="bold link" fill="#a6e3a1">85%</tspan>
    <tspan fill="#45475a"> (2h3m)</tspan>
    <tspan fill="#585b70"> · </tspan>
    <!-- 7d quota: peach bold, underlined -->
    <tspan class="bold link" fill="#fab387">61%</tspan>
    <tspan fill="#45475a"> (3d5h)</tspan>
    <tspan fill="#585b70"> │ </tspan>
    <!-- cost: gold bold -->
    <tspan class="bold" fill="#f9e2af">$4</tspan>
  </text>

  <!-- Link callout: path -->
  <line x1="74" y1="92" x2="74" y2="130" stroke="#585b70" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="34" y="140" fill="#6c7086" font-size="10">↑ file://</text>

  <!-- Link callout: branch -->
  <line x1="194" y1="92" x2="240" y2="130" stroke="#585b70" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="196" y="140" fill="#6c7086" font-size="10">↑ github.com/…/tree/…</text>

  <!-- Link callout: service links -->
  <line x1="533" y1="92" x2="560" y2="130" stroke="#585b70" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="488" y="140" fill="#6c7086" font-size="10">↑ railway · vercel · supabase</text>
</svg>
