<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 148" width="720" height="148">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace; font-size: 13.5px; }
      .bold { font-weight: bold; }
      .italic { font-style: italic; }
      .link { text-decoration: underline; text-underline-offset: 3px; }
    </style>
  </defs>

  <!-- Window chrome -->
  <rect width="720" height="148" fill="#181825" rx="10"/>

  <!-- Title bar -->
  <rect width="720" height="34" fill="#1e1e2e" rx="10"/>
  <rect y="20" width="720" height="14" fill="#1e1e2e"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="17" r="5.5" fill="#f38ba8"/>
  <circle cx="38" cy="17" r="5.5" fill="#f9e2af"/>
  <circle cx="56" cy="17" r="5.5" fill="#a6e3a1"/>

  <!-- Window title -->
  <text x="360" y="22" text-anchor="middle" fill="#585b70" font-size="12">Claude Code — clickline</text>

  <!-- Content background -->
  <rect y="34" width="720" height="114" fill="#1e1e2e"/>

  <!-- Prompt line (decorative) -->
  <text x="18" y="62" fill="#585b70">❯</text>

  <!-- ── LINE 1 ── -->
  <!-- path: sapphire, underlined (clickable) -->
  <text x="34" y="90">
    <tspan class="link" fill="#74c7ec">my-app/src</tspan>
    <!-- dot separator -->
    <tspan fill="#585b70"> · </tspan>
    <!-- branch: green, underlined (clickable → GitHub) -->
    <tspan class="link" fill="#a6e3a1">feat/dark-mode</tspan>
    <!-- pipe separator -->
    <tspan fill="#585b70"> │ </tspan>
    <!-- model: lavender bold -->
    <tspan class="bold" fill="#b4befe">Claude Sonnet 4.6</tspan>
  </text>

  <!-- ── LINE 2 ── -->
  <text x="34" y="115">
    <!-- context %: gold bold -->
    <tspan class="bold" fill="#f9e2af">35%</tspan>
    <!-- /200K: dim -->
    <tspan fill="#45475a">/200K</tspan>
    <!-- separator -->
    <tspan fill="#585b70"> │ </tspan>
    <!-- 5h quota: green bold, underlined (clickable → claude.ai/settings/usage) -->
    <tspan class="bold link" fill="#a6e3a1">85%</tspan>
    <tspan fill="#45475a"> (2h3m)</tspan>
    <!-- dot -->
    <tspan fill="#585b70"> · </tspan>
    <!-- 7d quota: peach bold, underlined (clickable → claude.ai/settings/usage) -->
    <tspan class="bold link" fill="#fab387">61%</tspan>
    <tspan fill="#45475a"> (3d5h)</tspan>
    <!-- separator -->
    <tspan fill="#585b70"> │ </tspan>
    <!-- cost: gold bold -->
    <tspan class="bold" fill="#f9e2af">$4</tspan>
  </text>

  <!-- Link callout: path -->
  <line x1="78" y1="92" x2="78" y2="130" stroke="#585b70" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="34" y="140" fill="#6c7086" font-size="10">↑ file://</text>

  <!-- Link callout: branch -->
  <line x1="194" y1="92" x2="300" y2="130" stroke="#585b70" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="254" y="140" fill="#6c7086" font-size="10">↑ github.com/…/tree/…</text>

  <!-- Link callout: quota -->
  <line x1="446" y1="117" x2="530" y2="130" stroke="#585b70" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="490" y="140" fill="#6c7086" font-size="10">↑ claude.ai/settings/usage</text>
</svg>
